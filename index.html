<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1ed">
  <meta name="xinyu-build" content="a6f349511b5c">
  <meta name="description" content="心屿：把情绪变成可以理解和照顾的天气。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>心屿 · 情绪天气台</title>
  <style>
:root {
  --ink: #27241f;
  --muted: #777066;
  --paper: #f7f3ee;
  --card: rgba(255, 255, 255, .72);
  --line: rgba(55, 47, 38, .11);
  --purple: #6f63a9;
  --purple-dark: #514783;
  --lavender: #d9d3ed;
  --peach: #eebf9e;
  --sage: #a9bba4;
  --danger: #a94d4d;
  --shadow: 0 18px 50px rgba(78, 61, 50, .11);
  --page-gutter: clamp(18px, 5vw, 28px);
  --nav-height: 62px;
  --nav-gap: 12px;
}

* { box-sizing: border-box; }

html { min-height: 100%; background: var(--paper); }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  background:
    radial-gradient(circle at 18% 8%, rgba(239, 191, 158, .35), transparent 28rem),
    radial-gradient(circle at 86% 38%, rgba(187, 177, 222, .4), transparent 30rem),
    linear-gradient(160deg, #faf6f1 0%, #f3efea 52%, #eeeaf2 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, textarea, input { font: inherit; }
button { color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 3px solid rgba(111, 99, 169, .24);
  outline-offset: 2px;
}

.ambient {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(3px);
  opacity: .5;
}
.ambient-a { width: 240px; height: 240px; top: -110px; right: -80px; background: rgba(184, 174, 220, .35); }
.ambient-b { width: 180px; height: 180px; bottom: 5%; left: -100px; background: rgba(236, 184, 144, .24); }

.app-shell {
  width: min(100%, 420px);
  min-height: 100vh;
  margin: 0 auto;
  position: relative;
  display: flex;
  flex-direction: column;
}

.topbar {
  min-height: 60px;
  padding: max(6px, env(safe-area-inset-top)) var(--page-gutter) 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
  background: linear-gradient(to bottom, rgba(247,243,238,.94), rgba(247,243,238,.68), transparent);
  backdrop-filter: blur(12px);
}

.brand { border: 0; background: transparent; padding: 8px 0; display: flex; align-items: center; gap: 9px; font-weight: 760; letter-spacing: .08em; cursor: pointer; }
.brand-mark { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(145deg, var(--purple), #aa86a9); box-shadow: 0 6px 16px rgba(96,77,137,.25); }
.icon-button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.5); display: grid; place-items: center; cursor: pointer; }
.icon-button svg, .bottom-nav svg { width: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

#app {
  flex: 1;
  padding: 6px var(--page-gutter) calc(var(--nav-height) + var(--nav-gap) * 2 + env(safe-area-inset-bottom));
  scroll-padding-bottom: calc(var(--nav-height) + 28px);
}
.screen { animation: screen-in .35s cubic-bezier(.2,.8,.2,1); }
@keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.eyebrow { margin: 0 0 8px; color: var(--purple-dark); font-size: 12px; font-weight: 760; letter-spacing: .16em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(30px, 7.5vw, 40px); line-height: 1.1; letter-spacing: -.04em; }
h2 { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.025em; }
h3 { margin: 0; font-size: 17px; }
p { line-height: 1.65; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 2px 8px; }
.section-head a, .text-button { min-height: 44px; padding: 10px 8px; border: 0; background: transparent; color: var(--purple-dark); font-weight: 650; cursor: pointer; text-decoration: none; }

.hero-copy { margin-top: 2px; max-width: 460px; }
.hero-copy p { color: var(--muted); margin: 7px 0 0; }

.weather-card {
  min-height: 232px;
  margin-top: 14px;
  padding: 20px 22px;
  border-radius: 29px;
  color: #fff;
  position: relative;
  overflow: hidden;
  background: linear-gradient(150deg, #5f578f 0%, #7d6e9d 45%, #c18fa1 100%);
  box-shadow: 0 24px 60px rgba(83, 69, 121, .26);
  isolation: isolate;
}
.weather-card::before, .weather-card::after { content: ""; position: absolute; border-radius: 50%; z-index: -1; filter: blur(1px); }
.weather-card::before { width: 230px; height: 230px; right: -70px; top: -60px; background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.5), rgba(255,255,255,.04) 55%, transparent 70%); animation: drift 8s ease-in-out infinite; }
.weather-card::after { width: 160px; height: 160px; left: -40px; bottom: -72px; background: rgba(239,189,160,.22); animation: drift 10s ease-in-out infinite reverse; }
@keyframes drift { 50% { transform: translate(12px, 8px) scale(1.06); } }
.weather-meta { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: rgba(255,255,255,.75); }
.weather-label { display: inline-flex; gap: 7px; align-items: center; }
.weather-dot { width: 7px; height: 7px; border-radius: 50%; background: #f5d1b3; box-shadow: 0 0 0 5px rgba(245,209,179,.14); }
.weather-main { margin-top: 20px; }
.weather-main strong { display: block; font-size: clamp(30px, 7vw, 36px); letter-spacing: -.05em; }
.weather-main p { margin: 5px 0 0; max-width: 310px; color: rgba(255,255,255,.78); line-height: 1.5; }
.weather-footer { position: absolute; left: 22px; right: 22px; bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.weather-mini { font-size: 12px; color: rgba(255,255,255,.68); }

.primary, .secondary, .soft-button, .danger-button {
  min-height: 50px;
  border: 0;
  border-radius: 17px;
  padding: 13px 20px;
  font-weight: 730;
  cursor: pointer;
  transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
}
.primary:hover, .secondary:hover, .soft-button:hover { transform: translateY(-1px); }
.primary { color: #fff; background: var(--ink); box-shadow: 0 12px 24px rgba(39,36,31,.17); }
.primary.light { color: var(--ink); background: rgba(255,255,255,.92); box-shadow: none; }
.primary.full, .secondary.full, .danger-button.full { width: 100%; }
.secondary { background: rgba(255,255,255,.65); border: 1px solid var(--line); }
.soft-button { background: rgba(111,99,169,.1); color: var(--purple-dark); }
.danger-button { background: rgba(169,77,77,.1); color: var(--danger); }
.button-row { display: flex; gap: 10px; margin-top: 22px; }
.button-row > * { flex: 1; }
button:disabled { opacity: .45; cursor: not-allowed; transform: none !important; }

.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini-card, .panel, .insight-card, .history-card {
  border: 1px solid var(--line);
  background: var(--card);
  backdrop-filter: blur(16px);
  box-shadow: var(--shadow);
}
.mini-card { padding: 17px; border-radius: 21px; }
.mini-card span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.mini-card strong { font-size: 17px; }
.panel { border-radius: 26px; padding: 22px; }

.tool-grid { display: grid; gap: 12px; }
.resume-card { width: 100%; margin-bottom: 12px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; border: 1px solid rgba(111,99,169,.22); border-radius: 18px; color: var(--purple-dark); background: rgba(217,211,237,.38); cursor: pointer; text-align: left; }
.resume-card span { color: var(--muted); font-size: 12px; }
.resume-card strong { font-size: 13px; }
.tool-card {
  width: 100%;
  padding: 18px;
  display: grid;
  grid-template-columns: 46px 1fr auto;
  column-gap: 13px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 22px;
  color: var(--ink);
  background: rgba(255,255,255,.65);
  box-shadow: var(--shadow);
  text-align: left;
  cursor: pointer;
}
.tool-icon { grid-row: 1 / 4; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 15px; background: rgba(217,211,237,.55); color: var(--purple-dark); font-size: 21px; }
.tool-time { grid-column: 3; color: var(--muted); font-size: 12px; }
.tool-card strong { grid-column: 2; font-size: 17px; }
.tool-card p { grid-column: 2 / 4; margin: 3px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.tool-action { grid-column: 2 / 4; margin-top: 8px; color: var(--purple-dark); font-size: 13px; font-weight: 700; }

.journey-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.5);
}
.journey-step { min-width: 0; text-align: center; color: var(--muted); font-size: 11px; }
.journey-step strong { display: block; margin-bottom: 3px; color: var(--ink); font-size: 13px; }
.journey-step + .journey-step { border-left: 1px solid var(--line); }

.empty-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-radius: 21px;
  background: rgba(255,255,255,.58);
}
.empty-card p { margin: 3px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.empty-card .soft-button { flex: 0 0 auto; min-height: 44px; padding: 10px 14px; }

.stepper { display: flex; gap: 7px; margin: 4px 0 26px; }
.stepper span { height: 4px; flex: 1; border-radius: 99px; background: rgba(39,36,31,.1); }
.stepper span.active { background: var(--purple); }
.prompt { margin: 8px 0 20px; color: var(--muted); }

.choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.choice, .segmented button {
  min-height: 58px;
  border-radius: 18px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.6);
  cursor: pointer;
  font-weight: 650;
}
.choice { display: flex; align-items: center; gap: 10px; padding: 13px 14px; text-align: left; }
.choice .emoji { font-size: 23px; }
.choice.selected, .segmented button.selected { border-color: rgba(111,99,169,.7); background: rgba(217,211,237,.55); box-shadow: inset 0 0 0 1px rgba(111,99,169,.2); }
.trigger-grid { grid-template-columns: repeat(4, 1fr); }
.trigger-grid .choice { min-height: 52px; justify-content: center; padding: 8px 4px; font-size: 13px; }

.range-wrap { margin: 24px 0; }
.range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.range-value { display: flex; align-items: baseline; gap: 7px; margin-bottom: 10px; }
.range-value strong { font-size: 34px; }
input[type="range"] { width: 100%; accent-color: var(--purple); }
textarea { width: 100%; min-height: 132px; resize: vertical; border: 1px solid var(--line); border-radius: 20px; padding: 16px; color: var(--ink); background: rgba(255,255,255,.62); line-height: 1.55; }
.suggestion-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.suggestion-chips button { border: 1px solid var(--line); background: rgba(255,255,255,.58); border-radius: 999px; padding: 9px 12px; color: var(--muted); cursor: pointer; font-size: 12px; }

.loading-orb { width: 120px; height: 120px; border-radius: 50%; margin: 80px auto 24px; background: radial-gradient(circle at 35% 30%, #f8ded0, #9a8bbb 62%, #5f578f); box-shadow: 0 18px 50px rgba(95,87,143,.28); animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.1); box-shadow: 0 25px 70px rgba(95,87,143,.35); } }
.loading-copy { text-align: center; }

.insight-stack { display: grid; gap: 11px; margin-top: 24px; }
.insight-card { border-radius: 22px; padding: 18px; display: grid; grid-template-columns: 42px 1fr; gap: 13px; align-items: start; }
.insight-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: rgba(217,211,237,.55); font-size: 19px; }
.insight-card small { color: var(--muted); display: block; margin-bottom: 5px; }
.insight-card p { margin: 0; line-height: 1.55; }
.tag { display: inline-flex; margin: 3px 5px 0 0; padding: 6px 10px; border-radius: 999px; font-size: 12px; background: rgba(111,99,169,.09); color: var(--purple-dark); }
.disclaimer { padding: 13px 15px; border-radius: 16px; color: var(--muted); background: rgba(255,255,255,.42); font-size: 12px; line-height: 1.55; margin-top: 16px; }

.option-block { margin: 22px 0; }
.option-block label { font-weight: 700; display: block; margin-bottom: 10px; }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
.segmented button { min-height: 48px; font-size: 13px; }

.exercise-hero { padding: 26px; border-radius: 30px; color: #fff; background: linear-gradient(150deg, #655d91, #987b9b 65%, #d3a48d); box-shadow: 0 20px 55px rgba(89,72,123,.24); }
.exercise-hero .eyebrow { color: rgba(255,255,255,.7); }
.exercise-hero p { color: rgba(255,255,255,.76); }
.breath-stage { min-height: 255px; display: grid; place-items: center; position: relative; }
.breath-circle { width: 145px; height: 145px; border-radius: 50%; display: grid; place-items: center; text-align: center; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); box-shadow: inset 0 0 40px rgba(255,255,255,.1); animation: breath-guide 8s ease-in-out infinite; }
.breath-circle strong { display: block; font-size: 30px; }
.breath-circle span { font-size: 12px; color: rgba(255,255,255,.72); }
@keyframes breath-guide { 0%,100% { transform: scale(.86); } 50% { transform: scale(1.08); } }
.exercise-list { display: grid; gap: 10px; margin-top: 22px; }
.exercise-step { display: flex; gap: 12px; align-items: center; padding: 15px; border-radius: 17px; background: rgba(255,255,255,.12); cursor: pointer; }
.exercise-step input { width: 20px; height: 20px; accent-color: #fff; }

.result-orb { width: 116px; height: 116px; margin: 28px auto 16px; display: grid; place-items: center; border-radius: 50%; color: #fff; background: linear-gradient(145deg, #8375ab, #d3a185); box-shadow: 0 20px 50px rgba(97,79,132,.25); }
.result-orb strong { font-size: 30px; }
.center { text-align: center; }

.chart-card { border-radius: 28px; padding: 22px 18px 17px; color: #fff; background: linear-gradient(150deg, #58517f, #7e719b); box-shadow: 0 20px 52px rgba(80,69,116,.22); }
.climate-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.climate-title-row .prompt { margin-bottom: 14px; }
.period-switch { flex: 0 0 auto; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.54); }
.period-switch button { min-height: 35px; padding: 7px 10px; border: 0; border-radius: 10px; color: var(--muted); background: transparent; cursor: pointer; font-size: 11px; white-space: nowrap; }
.period-switch button.selected { color: var(--purple-dark); background: rgba(217,211,237,.72); font-weight: 750; }
.chart-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
.chart-badge { border-radius: 999px; padding: 7px 10px; background: rgba(255,255,255,.13); font-size: 11px; color: rgba(255,255,255,.78); }
.chart { height: 170px; width: 100%; margin-top: 10px; overflow: visible; }
.chart .grid { stroke: rgba(255,255,255,.11); stroke-width: 1; }
.chart .area { fill: url(#areaGradient); }
.chart .line { fill: none; stroke: #f7d4bb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.chart .point { fill: #fff; stroke: #776a96; stroke-width: 3; }
.chart text { fill: rgba(255,255,255,.58); font-size: 10px; }
.report-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 10px; }
.report-stats article { min-width: 0; padding: 13px 5px; border: 1px solid var(--line); border-radius: 17px; background: rgba(255,255,255,.58); text-align: center; }
.report-stats span { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; }
.report-stats strong { display: block; margin-top: 4px; color: var(--purple-dark); font-size: 19px; }
.evidence-card, .signal-card, .care-observation { border: 1px solid var(--line); border-radius: 22px; background: rgba(255,255,255,.62); box-shadow: var(--shadow); }
.evidence-card { padding: 19px; }
.evidence-card p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.evidence-progress { height: 6px; margin-bottom: 14px; overflow: hidden; border-radius: 99px; background: rgba(39,36,31,.07); }
.evidence-progress span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--purple), #b88fa8); }
.signal-card { margin-top: 10px; padding: 18px; }
.signal-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 15px; }
.signal-head h3 { margin-top: 3px; }
.signal-head > strong { color: var(--purple-dark); font-size: 23px; }
.signal-row { display: grid; grid-template-columns: 46px 1fr 34px; gap: 9px; align-items: center; margin-top: 9px; font-size: 11px; }
.signal-row > span { color: var(--muted); }
.signal-row > div { height: 7px; overflow: hidden; border-radius: 99px; background: rgba(39,36,31,.07); }
.signal-row i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #9185b8, #d4a58d); }
.signal-row > strong { text-align: right; font-size: 11px; }
.care-observation { margin-top: 12px; padding: 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.care-observation h3 { margin-top: 4px; }
.care-observation p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
.care-observation .soft-button { flex: 0 0 auto; min-height: 44px; padding: 10px 14px; }
.climate-empty { margin-top: 8px; }
.history-list { display: grid; gap: 10px; }
.history-card { width: 100%; padding: 16px; border-radius: 20px; display: grid; grid-template-columns: 45px 1fr auto; gap: 12px; align-items: center; color: var(--ink); text-align: left; cursor: pointer; }
.history-weather { width: 45px; height: 45px; display: grid; place-items: center; border-radius: 15px; background: rgba(217,211,237,.48); font-size: 21px; }
.history-copy { min-width: 0; }
.history-copy strong, .history-copy small { display: block; overflow-wrap: anywhere; }
.history-copy small { margin-top: 3px; color: var(--muted); font-size: 12px; }
.source-label { padding: 5px 8px; border-radius: 999px; font-size: 10px; color: var(--muted); background: rgba(39,36,31,.05); }
.source-label.mine { color: var(--purple-dark); background: rgba(111,99,169,.1); }

.search-box {
  min-height: 50px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: rgba(255,255,255,.68);
}
.search-box span { color: var(--muted); font-size: 20px; }
.search-box input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--ink); background: transparent; }
.filter-strip { display: flex; gap: 7px; margin: 11px 0 4px; padding-bottom: 5px; overflow-x: auto; scrollbar-width: none; }
.filter-strip::-webkit-scrollbar { display: none; }
.filter-strip button { flex: 0 0 auto; min-height: 38px; padding: 8px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); background: rgba(255,255,255,.5); cursor: pointer; font-size: 12px; }
.filter-strip button.selected { border-color: rgba(111,99,169,.35); color: var(--purple-dark); background: rgba(217,211,237,.58); font-weight: 700; }
.empty-state { padding: 28px 20px; border: 1px dashed rgba(111,99,169,.24); border-radius: 24px; background: rgba(255,255,255,.36); text-align: center; }
.empty-state > span { width: 48px; height: 48px; margin: 0 auto 10px; display: grid; place-items: center; border-radius: 16px; color: var(--purple-dark); background: rgba(217,211,237,.5); font-size: 22px; }
.empty-state strong { display: block; }
.empty-state p { margin: 5px 0 14px; color: var(--muted); font-size: 12px; }
.empty-state.compact { margin-bottom: 4px; padding: 20px; }

.back-button { margin: -8px 0 8px -8px; }
.detail-head { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.detail-head .eyebrow { margin-bottom: 4px; }
.detail-head p { margin: 4px 0 0; }
.detail-weather { flex: 0 0 auto; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 21px; background: rgba(217,211,237,.58); font-size: 28px; }
.detail-block { margin-top: 12px; }
.detail-block p { margin: 8px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.detail-label { color: var(--muted); font-size: 12px; }
.insight-stack.compact { margin-top: 0; }
.detail-screen > .danger-button { margin-top: 18px; }

.safety-card { border: 1px solid rgba(169,77,77,.16); border-radius: 30px; padding: 26px; background: rgba(255,250,247,.8); box-shadow: var(--shadow); }
.safety-symbol { width: 60px; height: 60px; display: grid; place-items: center; border-radius: 20px; background: rgba(169,77,77,.1); color: var(--danger); font-size: 26px; }

  <script>
const STORAGE_KEY = 'xinyu.entries.v1';

function getSafeStorage(globalObject) {
  try {
    return globalObject?.localStorage || null;
  } catch {
    return null;
  }
}

const riskPatterns = [
  /(?:我)?想(?:要)?死/,
  /不想活(?:了|着|下去)?/,
  /想(?:要)?(?:自杀|轻生|结束生命)/,
  /(?:要|想|准备)(?:去)?跳楼/,
  /(?:要|想|准备)(?:去)?杀人/,
  /(?:结束|了结)(?:我)?自己(?:的)?生命/,
  /(?:伤害|杀死|弄死)(?:我自己|自己|别人|他人)/,
  /活着没意思/,
  /从(?:楼|这里)跳下去/,
  /割腕|服药自杀/
];

function detectRisk(text = '') {
  const normalized = String(text).replace(/\s+/g, '');
  return riskPatterns.some(pattern => pattern.test(normalized));
}

const triggerCopy = {
  学业: { event: '学习或公开表达带来了压力', thought: '担心准备不够，表现达不到期待', needs: ['确定感', '准备感'] },
  工作: { event: '工作任务或评价正在占据你的注意力', thought: '担心表现不好，或无法掌控接下来的情况', needs: ['掌控感', '被认可'] },
  人际: { event: '一段人际互动让你感到不舒服', thought: '担心自己没有被理解，或关系会发生变化', needs: ['被理解', '连接感'] },
  家庭: { event: '家庭中的互动触动了你', thought: '也许你在顾及他人时，忽略了自己的感受', needs: ['边界感', '被支持'] },
  感情: { event: '亲密关系中的不确定感被放大了', thought: '担心失去连接，或自己的需要不被回应', needs: ['安全感', '被回应'] },
  身体: { event: '身体状态正在影响此刻的情绪', thought: '不舒服或疲惫让应对事情变得更困难', needs: ['休息', '身体安定'] },
  经济: { event: '现实的经济压力让你感到紧绷', thought: '担心资源不足，未来缺少确定性', needs: ['安全感', '可执行计划'] },
  不知道: { event: '情绪已经出现，但原因暂时还不清晰', thought: '不需要马上找到答案，可以先陪自己停一会儿', needs: ['空间', '被接纳'] }
};

function analyzeEntry({ mood = '复杂', trigger = '不知道', note = '' }) {
  const base = triggerCopy[trigger] || triggerCopy.不知道;
  const publicSpeaking = /答辩|汇报|演讲|面试|发言|讲砸/.test(note);
  const conflict = /吵架|争吵|不回|冷战|误会|打断/.test(note);
  const deadline = /截止|来不及|ddl|明天|今晚|赶不完/.test(note.toLowerCase());
  let event = base.event;
  let thought = base.thought;
  let needs = [...base.needs];

  if (publicSpeaking) {
    event = '一次临近的答辩或公开表达正在带来压力';
    thought = '担心准备不充分、现场表现不好，或受到负面评价';
    needs = ['确定感', '准备感'];
  } else if (conflict) {
    event = '一段没有顺利进行的互动仍在影响你';
    thought = '也许你在担心自己没有被听见，或关系因此受损';
    needs = ['被理解', '关系中的安全感'];
  } else if (deadline) {
    event = '临近的截止时间让任务显得格外沉重';
    thought = '担心时间不够，无法把事情做到期待的程度';
    needs = ['清晰的下一步', '喘息空间'];
  }

  const secondary = mood === '焦虑' ? '紧张' : mood === '低落' ? '无力' : mood === '生气' ? '委屈' : '复杂';
  return {
    event,
    thought,
    emotions: [...new Set([mood, secondary])],
    needs
  };
}

function chooseExercise({ trigger, minutes, place, energy }) {
  if (place === '准备睡觉' || trigger === '身体') {
    return { type: 'breathe', title: '柔和呼吸', duration: minutes === 1 ? 60 : 90, reason: '先让身体慢下来，不急着解决所有问题。' };
  }
  if ((trigger === '工作' || trigger === '学业' || trigger === '经济') && energy !== '低') {
    return { type: 'plan', title: '三分钟最小行动', duration: 0, reason: '把无法掌控的担心，缩小成一个现在能完成的动作。' };
  }
  return { type: 'ground', title: '感官落地练习', duration: 0, reason: '把注意力从反复的念头，温和地带回此刻。' };
}

function resolveCareOutcome({ intensity, exerciseType, completed }) {
  const before = Number.isInteger(intensity) ? Math.min(10, Math.max(1, intensity)) : 5;
  const actionable = new Set(['breathe', 'ground', 'plan']);
  if (!completed || !actionable.has(exerciseType)) return { after: before, careType: 'skipped' };
  return { after: Math.max(1, before - 2), careType: exerciseType };
}

function readEntries(storage) {
  let raw;
  try {
    if (!storage) return { mode: 'readonly', entries: [] };
    raw = storage.getItem(STORAGE_KEY);
  } catch {
    return { mode: 'readonly', entries: [] };
  }
  if (raw === null) return { mode: 'writable', entries: [] };
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) throw new Error('not-array');
    return { mode: 'writable', entries: parsed.map(normalizeEntry).filter(Boolean) };
  } catch {
    return { mode: 'corrupt', entries: [] };
  }
}

const allowedMoods = new Set(['开心', '平静', '疲惫', '焦虑', '低落', '生气']);
const allowedTriggers = new Set(['学业', '工作', '人际', '家庭', '感情', '身体', '经济', '不知道']);
const allowedCare = new Set(['breathe', 'ground', 'plan', 'skipped']);
const IMPORT_LIMIT = 1000;
const IMPORT_BYTES_LIMIT = 1024 * 1024;

function normalizeEntry(item) {
  if (!item || typeof item !== 'object') return null;
  if (typeof item.id !== 'string' || item.id.length < 1 || item.id.length > 120) return null;
  if (typeof item.createdAt !== 'string' || !Number.isFinite(Date.parse(item.createdAt))) return null;
  if (!allowedMoods.has(item.mood) || !allowedTriggers.has(item.trigger)) return null;
  const before = Number(item.before);
  const after = Number(item.after);
  if (!Number.isInteger(before) || before < 1 || before > 10) return null;
  if (!Number.isInteger(after) || after < 1 || after > 10) return null;
  if (!allowedCare.has(item.careType)) return null;
  return {
    id: item.id,
    source: 'user',
    createdAt: new Date(item.createdAt).toISOString(),
    mood: item.mood,
    trigger: item.trigger,
    before,
    after,
    careType: item.careType,
    note: normalizeText(item.note, 280),
    insight: normalizeInsight(item.insight)
  };
}

function normalizeText(value, maxLength) {
  return typeof value === 'string' ? value.slice(0, maxLength) : '';
}

function normalizeInsight(value) {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
  const event = normalizeText(value.event, 320);
  const thought = normalizeText(value.thought, 320);
  const emotions = normalizeTextList(value.emotions);
  const needs = normalizeTextList(value.needs);
  if (!event && !thought && !emotions.length && !needs.length) return null;
  return { event, thought, emotions, needs };
}

function normalizeTextList(value) {
  if (!Array.isArray(value)) return [];
  return value.filter(item => typeof item === 'string').slice(0, 6).map(item => item.slice(0, 60));
}

function isReservedSample(item) {
  return item?.source === 'sample' || (typeof item?.id === 'string' && item.id.startsWith('sample-'));
}

function sortNewestFirst(entries) {
  return [...entries].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
}

function createExportPayload(entries = [], now = new Date()) {
  const safeEntries = entries
    .filter(item => item?.source === 'user' && !isReservedSample(item))
    .map(normalizeEntry)
    .filter(Boolean);
  return {
    product: 'xinyu',
    version: 2,
    exportedAt: new Date(now).toISOString(),
    entries: sortNewestFirst(safeEntries)
  };
}

function parseImportPayload(text) {
  if (typeof text !== 'string' || new Blob([text]).size > IMPORT_BYTES_LIMIT) {
    return { status: 'too-large', entries: [], skipped: 0, rejected: 0 };
  }
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    return { status: 'invalid-json', entries: [], skipped: 0, rejected: 0 };
  }
  let candidates;
  if (Array.isArray(parsed)) {
    candidates = parsed;
  } else if (parsed && typeof parsed === 'object') {
    if (parsed.product !== 'xinyu' || parsed.version !== 2) {
      return { status: 'unsupported', entries: [], skipped: 0, rejected: 0 };
    }
    if (!Array.isArray(parsed.entries)) {
      return { status: 'invalid-format', entries: [], skipped: 0, rejected: 0 };
    }
    candidates = parsed.entries;
  } else {
    return { status: 'invalid-format', entries: [], skipped: 0, rejected: 0 };
  }
  if (candidates.length > IMPORT_LIMIT) {
    return { status: 'too-many', entries: [], skipped: 0, rejected: 0 };
  }
  const ids = new Set();
  const entries = [];
  let skipped = 0;
  let rejected = 0;
  for (const candidate of candidates) {
    if (isReservedSample(candidate)) {
      rejected += 1;
      continue;
    }
    const safe = normalizeEntry(candidate);
    if (!safe) {
      rejected += 1;
      continue;
    }
    if (ids.has(safe.id)) {
      skipped += 1;
      continue;
    }
    ids.add(safe.id);
    entries.push(safe);
  }
  return { status: entries.length ? 'ready' : 'empty', entries: sortNewestFirst(entries), skipped, rejected };
}

function importEntries(storage, text, { allowReplaceCorrupt = false } = {}) {
  const parsed = parseImportPayload(text);
  if (parsed.status !== 'ready') return { ...parsed, added: 0 };
  const current = readEntries(storage);
  if (current.mode === 'readonly') return { status: 'readonly', entries: current.entries, added: 0, skipped: parsed.skipped, rejected: parsed.rejected };
  if (current.mode === 'corrupt' && !allowReplaceCorrupt) {
    return { status: 'corrupt-requires-confirmation', entries: [], added: 0, skipped: parsed.skipped, rejected: parsed.rejected };
  }
  const existingIds = new Set(current.entries.map(item => item.id));
  const additions = parsed.entries.filter(item => {
    if (existingIds.has(item.id)) {
      parsed.skipped += 1;
      return false;
    }
    existingIds.add(item.id);
    return true;
  });
  if (!additions.length) {
    return { status: 'duplicate', entries: current.entries, added: 0, skipped: parsed.skipped, rejected: parsed.rejected };
  }
  const merged = sortNewestFirst([...current.entries, ...additions]);
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(merged));
  } catch {
    return { status: 'failed', entries: readEntries(storage).entries, added: 0, skipped: parsed.skipped, rejected: parsed.rejected };
  }
  const verified = readEntries(storage);
  const verifiedIds = new Set(verified.entries.map(item => item.id));
  const isValid = verified.mode === 'writable'
    && verified.entries.length === merged.length
    && verifiedIds.size === merged.length
    && merged.every(item => verifiedIds.has(item.id));
  if (!isValid) return { status: 'failed', entries: verified.entries, added: 0, skipped: parsed.skipped, rejected: parsed.rejected };
  return { status: 'imported', entries: verified.entries, added: additions.length, skipped: parsed.skipped, rejected: parsed.rejected };
}

function filterEntries(entries = [], { mood = '全部', query = '' } = {}) {
  const needle = String(query).trim().toLocaleLowerCase();
  return sortNewestFirst(entries.filter(item => {
    if (item?.source !== 'user' && item?.source !== 'session') return false;
    if (mood !== '全部' && item.mood !== mood) return false;
    if (!needle) return true;
    return [item.note, item.mood, item.trigger].some(value => String(value || '').toLocaleLowerCase().includes(needle));
  }));
}

function localDay(date) {
  return new Date(date.getFullYear(), date.getMonth(), date.getDate());
}

function localDayKey(date) {
  return `${date.getFullYear()}-${date.getMonth()}-${date.getDate()}`;
}

function computeUsageStats(entries = [], now = new Date()) {
  const current = new Date(now);
  const personal = entries.filter(item => item?.source === 'user' && Number.isFinite(Date.parse(item.createdAt)));
  const eligible = personal.map(item => new Date(item.createdAt)).filter(date => date <= current);
  const today = localDay(current);
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const thisWeek = eligible.filter(date => date >= monday).length;
  const dayKeys = new Set(eligible.map(localDayKey));
  const cursor = new Date(today);
  if (!dayKeys.has(localDayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  let streak = 0;
  while (dayKeys.has(localDayKey(cursor))) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }
  return { total: personal.length, thisWeek, streak };
}

const moodOrder = ['开心', '平静', '疲惫', '焦虑', '低落', '生气'];
const triggerOrder = ['学业', '工作', '人际', '家庭', '感情', '身体', '经济', '不知道'];
const careOrder = ['breathe', 'ground', 'plan'];

function reconcileEntrySources(userEntries = [], sessionEntries = []) {
  const userIds = new Set(userEntries.map(item => item?.id).filter(Boolean));
  return {
    userEntries: [...userEntries],
    sessionEntries: sessionEntries.filter(item => item?.id && !userIds.has(item.id))
  };
}

function roundOne(value) {
  return Math.round((value + Number.EPSILON) * 10) / 10;
}

function rankedBreakdown(entries, key, order) {
  const counts = new Map();
  entries.forEach(item => counts.set(item[key], (counts.get(item[key]) || 0) + 1));
  return [...counts]
    .map(([name, count]) => ({ name, count, share: Math.round((count / entries.length) * 100) }))
    .sort((a, b) => b.count - a.count || order.indexOf(a.name) - order.indexOf(b.name));
}

function buildPeriodReport(entries = [], { days = 7, now = new Date() } = {}) {
  const safeDays = days === 30 ? 30 : 7;
  const current = new Date(now);
  const safeNow = Number.isFinite(current.getTime()) ? current : new Date();
  const start = new Date(safeNow.getFullYear(), safeNow.getMonth(), safeNow.getDate());
  start.setDate(start.getDate() - (safeDays - 1));

  const byId = new Map();
  for (const item of entries) {
    if (item?.source !== 'user' && item?.source !== 'session') continue;
    if (isReservedSample(item)) continue;
    const normalized = normalizeEntry(item);
    if (!normalized || !Number.isInteger(item.before) || !Number.isInteger(item.after)) continue;
    const candidate = { ...normalized, source: item.source };
    const existing = byId.get(candidate.id);
    if (!existing || (existing.source === 'session' && candidate.source === 'user')) byId.set(candidate.id, candidate);
  }
  const periodEntries = sortNewestFirst([...byId.values()].filter(item => {
    const createdAt = new Date(item.createdAt);
    return createdAt >= start && createdAt <= safeNow;
  }));
  const count = periodEntries.length;
  const activeDays = new Set(periodEntries.map(item => localDayKey(new Date(item.createdAt)))).size;
  const patternReady = count >= 3 && activeDays >= 2;
  const averageBefore = count ? roundOne(periodEntries.reduce((sum, item) => sum + item.before, 0) / count) : null;
  const averageAfter = count ? roundOne(periodEntries.reduce((sum, item) => sum + item.after, 0) / count) : null;
  const averageChange = count ? roundOne(averageBefore - averageAfter) : null;
  const moodBreakdown = count ? rankedBreakdown(periodEntries, 'mood', moodOrder) : [];
  const triggerBreakdown = count ? rankedBreakdown(periodEntries, 'trigger', triggerOrder) : [];

  let effectiveCare = null;
  if (patternReady) {
    const careStats = new Map(careOrder.map(type => [type, { type, count: 0, totalChange: 0, days: new Set() }]));
    periodEntries.forEach(item => {
      const stat = careStats.get(item.careType);
      if (!stat) return;
      stat.count += 1;
      stat.totalChange += item.before - item.after;
      stat.days.add(localDayKey(new Date(item.createdAt)));
    });
    effectiveCare = [...careStats.values()]
      .filter(stat => stat.count >= 2 && stat.days.size >= 2 && stat.totalChange / stat.count > 0)
      .map(stat => ({ type: stat.type, count: stat.count, averageChange: roundOne(stat.totalChange / stat.count) }))
      .sort((a, b) => b.averageChange - a.averageChange || b.count - a.count || careOrder.indexOf(a.type) - careOrder.indexOf(b.type))[0] || null;
  }

  return {
    days: safeDays,
    entries: periodEntries,
    count,
    sessionCount: periodEntries.filter(item => item.source === 'session').length,
    activeDays,
    patternReady,
    missingEntries: Math.max(0, 3 - count),
    missingDays: Math.max(0, 2 - activeDays),
    averageBefore,
    averageAfter,
    averageChange,
    dominantMood: patternReady ? (moodBreakdown[0] || null) : null,
    topTrigger: patternReady ? (triggerBreakdown[0] || null) : null,
    moodBreakdown: patternReady ? moodBreakdown : [],
    triggerBreakdown: patternReady ? triggerBreakdown : [],
    effectiveCare
  };
}

function saveEntryIdempotently(storage, entry) {
  const safeEntry = normalizeEntry(entry);
  if (!safeEntry) return { status: 'invalid', entries: [] };
  const current = readEntries(storage);
  if (current.mode !== 'writable') return { status: 'readonly', entries: current.entries };
  if (current.entries.some(item => item.id === safeEntry.id)) return { status: 'duplicate', entries: current.entries };
  const entries = [safeEntry, ...current.entries];
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(entries));
    return { status: 'saved', entries };
  } catch {
    return { status: 'failed', entries: current.entries };
  }
}

function removeEntryById(storage, id) {
  const current = readEntries(storage);
  if (current.mode !== 'writable') return { status: 'readonly', entries: current.entries };
  const entries = current.entries.filter(item => item.id !== id);
  if (entries.length === current.entries.length) return { status: 'not-found', entries: current.entries };
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(entries));
    const verified = readEntries(storage);
    if (verified.mode !== 'writable' || verified.entries.some(item => item.id === id) || verified.entries.length !== entries.length) {
      return { status: 'failed', entries: current.entries };
    }
    return { status: 'removed', entries: verified.entries };
  } catch {
    return { status: 'failed', entries: current.entries };
  }
}

function clearEntriesIfUnchanged(storage, expectedRaw) {
  try {
    if (!storage) return { status: 'readonly' };
    if (storage.getItem(STORAGE_KEY) !== expectedRaw) return { status: 'changed' };
    storage.removeItem(STORAGE_KEY);
    return storage.getItem(STORAGE_KEY) === null ? { status: 'cleared' } : { status: 'failed' };
  } catch {
    return { status: 'failed' };
  }
}

function summarizeEntries(entries = []) {
  const personal = entries.filter(item => item.source === 'user');
  const observed = entries.filter(item => item.source === 'user' || item.source === 'session');
  const samplesOnly = entries.length > 0 && entries.every(item => item.source === 'sample');
  const evidenceCount = samplesOnly ? entries.length : observed.length;
  const patternReady = evidenceCount >= 3;
  const triggerCounts = new Map();
  const careGains = new Map();
  entries.forEach(item => {
    if (item.trigger) triggerCounts.set(item.trigger, (triggerCounts.get(item.trigger) || 0) + 1);
    if (item.careType && Number.isFinite(item.before) && Number.isFinite(item.after)) {
      const previous = careGains.get(item.careType) || { total: 0, count: 0 };
      careGains.set(item.careType, { total: previous.total + Math.max(0, item.before - item.after), count: previous.count + 1 });
    }
  });
  const topTrigger = patternReady ? ([...triggerCounts].sort((a, b) => b[1] - a[1])[0]?.[0] || '暂未发现') : '正在积累';
  const bestCare = [...careGains]
    .filter(([, value]) => value.count >= 2)
    .map(([type, value]) => [type, value.total / value.count])
    .sort((a, b) => b[1] - a[1])[0]?.[0] || '暂无';
  return { personalCount: personal.length, evidenceCount, patternReady, topTrigger, bestCare: patternReady ? bestCare : '暂无' };
}

function chartPoints(entries) {
  if (!entries.length || entries.some(item => !Number.isFinite(item.after) || !Number.isFinite(Date.parse(item.createdAt)))) return null;
  const values = entries;
  const xStep = values.length > 1 ? 290 / (values.length - 1) : 0;
  const coords = values.map((item, index) => ({ x: 20 + index * xStep, y: 148 - ((Number(item.after ?? item.before) - 1) / 9) * 112, item }));
  const line = coords.map((p, i) => `${i ? 'L' : 'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const area = `${line} L ${coords.at(-1).x.toFixed(1)} 155 L ${coords[0].x.toFixed(1)} 155 Z`;
  const circles = coords.map(p => `<circle class="point" cx="${p.x}" cy="${p.y}" r="5"/>`).join('');
  const labels = coords.map(p => `<text x="${p.x}" y="168" text-anchor="middle">${new Date(p.item.createdAt).getMonth() + 1}/${new Date(p.item.createdAt).getDate()}</text>`).join('');
  return { line, area, circles, labels };
}

function waitForController(timeout = 3500) {
  if (navigator.serviceWorker.controller) return Promise.resolve(navigator.serviceWorker.controller);
  return new Promise(resolve => {
    let settled = false;
    let timer;
    const finish = value => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      navigator.serviceWorker.removeEventListener('controllerchange', changed);
      resolve(value);
    };
    const changed = () => finish(navigator.serviceWorker.controller);
    timer = setTimeout(() => finish(null), timeout);
    navigator.serviceWorker.addEventListener('controllerchange', changed);
  });
}

function checkShell(controller, timeout = 2500) {
  return new Promise(resolve => {
    const channel = new MessageChannel();
    let settled = false;
    let timer;
    const finish = value => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      channel.port1.close();
      resolve(value);
    };
    timer = setTimeout(() => finish(null), timeout);
    channel.port1.onmessage = event => finish(event.data);
    try {
      controller.postMessage({ type: 'CHECK_SHELL' }, [channel.port2]);
    } catch {
      finish(null);
    }
  });
}

function withTimeout(promise, timeout, message) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(message)), timeout))
  ]);
}

async function refreshOfflineReadiness() {
  const attempt = ++offlineCheckAttempt;
  const controller = navigator.serviceWorker.controller;
  if (!controller) {
    if (attempt === offlineCheckAttempt) offlineState = 'online-only';
    return refreshProfile();
  }
  const result = await checkShell(controller);
  if (attempt !== offlineCheckAttempt) return;
  const latestController = navigator.serviceWorker.controller;
  if (latestController && latestController !== controller) return refreshOfflineReadiness();
  if (result?.ready === true && result.buildId === pageBuildId) {
    offlineState = 'ready';
  } else {
    offlineState = pwaRegistration?.installing || pwaRegistration?.waiting ? 'checking' : 'online-only';
  }
  refreshProfile();
}

function watchWorker(worker) {
  if (!worker) return;
  worker.addEventListener('statechange', () => {
    if (worker.state === 'activated') refreshOfflineReadiness();
  });
}

async function registerPwa() {
  if (!('serviceWorker' in navigator)) {
    offlineState = 'unsupported';
    return refreshProfile();
  }
  try {
    pwaRegistration = await navigator.serviceWorker.register('./sw.js');
    watchWorker(pwaRegistration.installing || pwaRegistration.waiting);
    pwaRegistration.addEventListener('updatefound', () => {
      offlineState = 'checking';
      refreshProfile();
      watchWorker(pwaRegistration.installing);
    });
    await withTimeout(navigator.serviceWorker.ready, 6000, 'Service worker readiness timeout');
    const controller = await waitForController();
    if (!controller) throw new Error('No service worker controller');
    await refreshOfflineReadiness();
  } catch {
    offlineState = 'online-only';
  }
  refreshProfile();
}

async function promptInstall() {
  if (!deferredInstallPrompt || installState === 'prompting' || installState === 'installed') return;
  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  const attempt = ++installAttempt;
  installState = 'prompting';
  refreshProfile();
  try {
    await promptEvent.prompt();
    const choice = await promptEvent.userChoice;
    if (choice?.outcome === 'accepted' && installState !== 'installed') {
      installState = 'accepted';
      setTimeout(() => {
        if (installState === 'accepted' && attempt === installAttempt) {
          installState = isStandalone() ? 'installed' : 'menu';
          refreshProfile();
        }
      }, 8000);
    }
  } catch {
    // Fall back to browser-menu guidance below.
  } finally {
    if (!['installed', 'accepted'].includes(installState) && attempt === installAttempt) installState = 'menu';
    refreshProfile();
  }
}

function findEntry(source, id) {
  const pool = source === 'user' ? userEntries : source === 'session' ? sessionEntries : sampleEntries;
  return pool.find(item => item.source === source && item.id === id) || null;
}

function renderPrivacy() {
  const writable = storageWritable;
  const lockReady = storageLockReady;
  return `<section class="screen"><p class="eyebrow">PRIVACY BY DEFAULT</p><h1>你的岛，属于你</h1><p class="prompt">记录只留在这个浏览器中。没有账号，没有上传，也没有广告追踪。</p>
    <article class="panel"><div class="privacy-row"><div><strong>本地保存</strong><p>${canPersist() ? '刷新后仍可看到，换设备不会同步' : persisted.mode === 'corrupt' ? '旧数据无法读取，可通过恢复或清除修复' : '当前浏览器仅保留本次页面记录'}</p></div><span class="status-pill">${persisted.mode === 'corrupt' ? '待修复' : !writable ? '只读保护' : lockReady ? '已开启' : '仅本次'}</span></div><div class="privacy-row"><div><strong>网络传输</strong><p>情绪文字不会发送到服务器</p></div><span class="status-pill">无</span></div><div class="privacy-row"><div><strong>示例数据</strong><p>始终标注“示例”，不混作你的记录</p></div><span class="status-pill">5 条</span></div></article>
    <div class="section-head"><h3>管理数据</h3></div><div class="button-row"><button class="soft-button" data-go="profile">备份与恢复</button><button class="danger-button" data-clear ${persisted.mode === 'readonly' || !lockReady ? 'disabled' : ''}>${persisted.mode === 'corrupt' ? '清除损坏数据' : '清除我的记录'}</button></div>
    <div class="section-head"><h3>安全支持</h3></div><article class="panel"><p style="margin-top:0">如果情绪已经超出独自承受的范围，可以联系可信任的人或专业支持。</p><button class="secondary full" data-go="safety">查看援助方式</button></article>
    <div class="disclaimer">心屿不是医疗产品，不提供心理诊断、治疗建议或紧急救援。</div></section>`;
}

function renderSafety() {
  return `<section class="screen"><article class="safety-card"><div class="safety-symbol">♡</div><p class="eyebrow" style="margin-top:20px;color:#8b4747">你不必独自扛着</p><h2>现在，先和一个真实的人建立联系</h2><p class="muted">如果你正考虑伤害自己或他人，或处于即时危险中，请离开危险物品和地点，联系身边可信任的人，并尽快寻求专业或紧急帮助。</p>
    <div class="hotline"><span>全国统一心理援助热线（中国大陆）</span><a href="tel:12356">12356</a></div>
    <p class="small muted">如果存在即时人身危险，请联系当地紧急服务。心屿无法提供紧急救援。</p>
    <div class="button-row"><button class="secondary" data-risk-edit>这不是我的意思</button><button class="primary" data-risk-exit>返回首页</button></div></article></section>`;
}

function formatDay(date) {
  return `${date.getMonth() + 1}月${date.getDate()}日`;
}

function startBreathing() {
  if (exerciseInterval) return;
  const seconds = draft.exercise.duration;
  exerciseDeadline = Date.now() + seconds * 1000;
  const button = document.querySelector('[data-breathe-start]');
  if (button) { button.disabled = true; button.textContent = '跟着圆圈，慢慢呼吸'; }
  tickBreathing();
  exerciseInterval = setInterval(tickBreathing, 250);
}

function tickBreathing() {
    if (!exerciseDeadline || view !== 'exercise' || document.hidden) return;
    const remaining = Math.max(0, Math.ceil((exerciseDeadline - Date.now()) / 1000));
    const time = document.querySelector('#breath-time');
    const cue = document.querySelector('#breath-cue');
    if (time) time.textContent = remaining;
    if (cue) cue.textContent = `${remaining % 8 > 4 ? '慢慢呼气' : '轻轻吸气'}`;
    if (remaining <= 0) {
      clearExerciseTimer();
      finishExercise();
    }
}

function finishExercise() {
  if (draft.exerciseOrigin === 'toolbox') {
    clearExerciseTimer();
    go('tools');
    notify('练习完成。谢谢你照顾了此刻的自己');
    return;
  }
  const outcome = resolveCareOutcome({ intensity: draft.intensity, exerciseType: draft.exercise?.type, completed: true });
  draft.after = outcome.after;
  draft.careType = outcome.careType;
  go('result');
}

function skipExercise() {
  if (draft.exerciseOrigin === 'toolbox') return go('tools');
  const outcome = resolveCareOutcome({ intensity: draft.intensity, exerciseType: draft.exercise?.type, completed: false });
  draft.after = outcome.after;
  draft.careType = outcome.careType;
  go('result');
}

async function saveDraft() {
  if (draft.saved) return;
  if (draft.exerciseOrigin !== 'diary') return notify('工具练习不会创建日记记录');
  const entry = {
    id: draft.id,
    source: 'user',
    createdAt: new Date().toISOString(),
    mood: draft.mood,
    trigger: draft.trigger,
    before: draft.intensity,
    after: draft.after,
    careType: draft.careType,
    note: draft.note,
    insight: draft.insight
  };
  if (!canPersist()) {
    draft.saved = true;
    resumableDiaryView = null;
    if (!sessionEntries.some(item => item.id === entry.id)) sessionEntries.unshift({ ...entry, source: 'session' });
    go('climate');
    notify(storageLockReady ? '浏览器存储不可用；记录仅在本次页面保留' : '当前浏览器缺少安全锁；记录仅在本次页面保留');
    return;
  }
  const result = await withStorageLock(() => saveEntryIdempotently(storage, entry));
  if (result.status === 'invalid') {
    notify('记录内容不完整，请返回检查后重试');
    return;
  }
  if (result.status === 'failed' || result.status === 'readonly') {
    applyStoredSnapshot(readEntries(storage), false);
    draft.saved = true;
    resumableDiaryView = null;
    if (!userEntries.some(item => item.id === entry.id) && !sessionEntries.some(item => item.id === entry.id)) sessionEntries.unshift({ ...entry, source: 'session' });
    go('climate');
    notify('浏览器未能保存；本次结果仅在当前页面有效');
    return;
  }
  draft.saved = true;
  resumableDiaryView = null;
  applyStoredSnapshot({ mode: 'writable', entries: result.entries }, false);
  go('climate');
}

function startTool(type) {
  const tools = {
    breathe: { type: 'breathe', title: '一分钟柔和呼吸', duration: 60, reason: '不用追求深呼吸，只需要让呼气比吸气稍微长一点。' },
    ground: { type: 'ground', title: '感官落地练习', duration: 0, reason: '把注意力从反复的念头，温和地带回此刻。' },
    plan: { type: 'plan', title: '三分钟最小行动', duration: 0, reason: '不用解决整件事，只把担心缩成一个现在能完成的动作。' },
    move: { type: 'move', title: '三分钟轻柔活动', duration: 0, reason: '不追求运动量，只让久坐和紧绷的身体重新流动。' }
  };
  if (!tools[type]) return;
  suspendedDiaryDraft = draft;
  draft = freshDraft();
  draft.exerciseOrigin = 'toolbox';
  draft.exercise = tools[type];
  go('exercise');
}

async function deleteActiveEntry() {
  if (!activeEntry) return;
  const item = findEntry(activeEntry.source, activeEntry.id);
  if (!item || item.source === 'sample') return;
  if (item.source === 'session') {
    sessionEntries = sessionEntries.filter(entry => entry.id !== item.id);
    activeEntry = null;
    go(detailReturnView);
    notify('未保存记录已删除');
    return;
  }
  if (!storageLockReady) return notify('当前浏览器不支持安全删除，请先导出备份');
  if (!window.confirm('确认删除这条情绪日记吗？删除后无法恢复。')) return;
  const result = await withStorageLock(() => removeEntryById(storage, item.id));
  if (result.status !== 'removed') return notify('未能删除，记录仍然保留');
  applyStoredSnapshot({ mode: 'writable', entries: result.entries }, false);
  activeEntry = null;
  go(detailReturnView);
  notify('这条记录已删除');
}

function withStorageLock(action) {
  if (storageLockReady) return globalThis.navigator.locks.request(STORAGE_KEY, action);
  return Promise.resolve(action());
}

async function clearPersonalData() {
  if (!storageLockReady) return notify('当前浏览器不支持安全清除，请先导出备份');
  let snapshot;
  try {
    snapshot = storage.getItem(STORAGE_KEY);
  } catch {
    return notify('无法读取当前数据，未执行清除');
  }
  if (!window.confirm('确认清除这个浏览器中的所有个人记录吗？示例数据会保留。')) return;
  try {
    const result = await withStorageLock(() => clearEntriesIfUnchanged(storage, snapshot));
    if (result.status === 'changed') return notify('确认期间记录发生了变化，为避免误删已取消清除');
    if (result.status !== 'cleared') throw new Error('not-cleared');
    userEntries = [];
    sessionEntries = [];
    persisted = readEntries(storage);
    storageWritable = persisted.mode === 'writable';
    notify('个人记录已从这个浏览器清除');
    render();
  } catch {
    notify('未能清除，现有记录仍然保留');
    render();
  }
}

async function exportPersonalData() {
  const latest = await withStorageLock(() => readEntries(storage));
  if (latest.mode !== 'writable') return notify('暂时无法读取已保存记录');
  applyStoredSnapshot(latest, false);
  const payload = createExportPayload(latest.entries.map(item => ({ ...item, source: 'user' })), new Date());
  if (!payload.entries.length) return notify('还没有可以导出的个人记录');
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `心屿记录-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  render();
}

async function restorePersonalData(file) {
  if (!file) return;
  if (!storageLockReady) return notify('当前浏览器不支持安全恢复');
  if (file.size > 1024 * 1024) return notify('备份文件超过 1 MB，未读取');
  let text;
  try {
    text = await file.text();
  } catch {
    return notify('无法读取这个文件');
  }
  let result = await withStorageLock(() => importEntries(storage, text));
  if (result.status === 'corrupt-requires-confirmation') {
    if (!window.confirm('检测到旧数据已损坏。继续恢复会用备份替换损坏内容，是否继续？')) return;
    result = await withStorageLock(() => importEntries(storage, text, { allowReplaceCorrupt: true }));
  }
  if (result.status === 'imported') {
    applyStoredSnapshot({ mode: 'writable', entries: result.entries });
    return notify(`已恢复 ${result.added} 条记录${result.skipped ? `，跳过 ${result.skipped} 条重复` : ''}`);
  }
  if (result.status === 'duplicate') {
    applyStoredSnapshot({ mode: 'writable', entries: result.entries });
    return notify('这些记录已在心屿中，没有重复导入');
  }
  if (result.status === 'empty') return notify('文件中没有可恢复的有效记录');
  if (result.status === 'too-large' || result.status === 'too-many') return notify('备份内容过大，未导入');
  if (result.status === 'invalid-json' || result.status === 'invalid-format') return notify('这不是有效的心屿备份文件');
  if (result.status === 'unsupported') return notify('备份版本或来源不受支持');
  applyStoredSnapshot(readEntries(storage));
  notify(result.status === 'readonly' ? '浏览器存储处于只读保护' : '恢复未完成，现有记录仍以浏览器实际内容为准');
}

function applyStoredSnapshot(snapshot, shouldRender = true) {
  const nextUsers = snapshot.entries.map(item => ({ ...item, source: 'user' }));
  const reconciled = reconcileEntrySources(nextUsers, sessionEntries);
  userEntries = reconciled.userEntries;
  sessionEntries = reconciled.sessionEntries;
  persisted = snapshot;
  storageWritable = snapshot.mode === 'writable';
  if (shouldRender) render();
}

document.addEventListener('click', event => {
  const target = event.target.closest('button, [data-go]');
  if (!target) return;
  if (target.dataset.go) return go(target.dataset.go);
  if (target.dataset.climateDays) { climateDays = Number(target.dataset.climateDays) === 30 ? 30 : 7; return render(); }
  if (target.hasAttribute('data-resume-diary') && resumableDiaryView) {
    const resumeView = resumableDiaryView;
    resumableDiaryView = null;
    return go(resumeView);
  }
  if (target.dataset.historyMood) { historyMood = target.dataset.historyMood; return render(); }
  if (target.hasAttribute('data-reset-history')) { historyMood = '全部'; historyQuery = ''; return render(); }
  if (target.hasAttribute('data-import')) return document.querySelector('#import-file')?.click();
  if (target.hasAttribute('data-install')) return promptInstall();
  if (target.dataset.tool) return startTool(target.dataset.tool);
  if (target.dataset.entryId && target.dataset.entrySource) {
    detailReturnView = view === 'history' ? 'history' : 'climate';
    activeEntry = { source: target.dataset.entrySource, id: target.dataset.entryId };
    return go('detail');
  }
  if (target.hasAttribute('data-delete-entry')) return deleteActiveEntry();
  if (target.hasAttribute('data-start')) { draft = freshDraft(); resumableDiaryView = null; checkinStep = 1; return go('checkin'); }
  if (target.dataset.mood) { draft.mood = target.dataset.mood; return render(); }
  if (target.dataset.trigger) { draft.trigger = target.dataset.trigger; return render(); }
  if (target.hasAttribute('data-next')) { checkinStep = Math.min(3, checkinStep + 1); return render(); }
  if (target.hasAttribute('data-back')) { checkinStep = Math.max(1, checkinStep - 1); return render(); }
  if (target.dataset.suggestion) { draft.note = target.dataset.suggestion; const note = document.querySelector('#note'); if (note) note.value = draft.note; return; }
  if (target.hasAttribute('data-analyze')) {
    if (detectRisk(draft.note)) return go('safety');
    draft.insight = analyzeEntry(draft);
    go('loading');
    analysisTimer = setTimeout(() => go('insight'), 850);
    return;
  }
  if (target.hasAttribute('data-edit')) { checkinStep = 3; return go('checkin'); }
  if (target.hasAttribute('data-accept')) return go('care');
  if (target.dataset.option) { draft[target.dataset.option] = target.dataset.option === 'minutes' ? Number(target.dataset.value) : target.dataset.value; return render(); }
  if (target.hasAttribute('data-recommend')) { draft.exercise = chooseExercise(draft); return go('exercise'); }
  if (target.hasAttribute('data-breathe-start')) return startBreathing();
  if (target.hasAttribute('data-ex-complete')) return finishExercise();
  if (target.hasAttribute('data-skip')) return skipExercise();
  if (target.hasAttribute('data-save')) return saveDraft();
  if (target.hasAttribute('data-clear')) return clearPersonalData();
  if (target.hasAttribute('data-export')) return exportPersonalData();
  if (target.hasAttribute('data-risk-edit')) { checkinStep = 3; return go('checkin'); }
  if (target.hasAttribute('data-risk-exit')) { draft = freshDraft(); return go('home'); }
});

document.addEventListener('input', event => {
  if (event.target.id === 'history-search') {
    historyQuery = event.target.value;
    const results = document.querySelector('#history-results');
    if (results) results.innerHTML = renderHistoryResults();
  }
  if (event.target.id === 'intensity') {
    draft.intensity = Number(event.target.value);
    const output = document.querySelector('#intensity-display');
    if (output) output.textContent = draft.intensity;
  }
  if (event.target.id === 'note') draft.note = event.target.value;
  if (event.target.id === 'after') {
    draft.after = Number(event.target.value);
    const output = document.querySelector('#after-value');
    if (output) output.textContent = draft.after;
    updateResultFeedback();
  }
});

function updateResultFeedback() {
  const delta = draft.intensity - draft.after;
  const deltaNode = document.querySelector('#result-delta');
  const titleNode = document.querySelector('#result-title');
  if (deltaNode) deltaNode.textContent = delta > 0 ? `−${delta}` : delta === 0 ? '≈' : `+${Math.abs(delta)}`;
  if (titleNode) titleNode.textContent = delta > 0 ? `轻了 ${delta} 格` : delta === 0 ? '没有变化也没关系' : '情绪变强了，也值得被看见';
}

document.addEventListener('change', event => {
  if (event.target.id === 'import-file') {
    const [file] = event.target.files || [];
    restorePersonalData(file).finally(() => { event.target.value = ''; });
    return;
  }
  if (event.target.matches('[data-ex-step]')) {
    const boxes = [...document.querySelectorAll('[data-ex-step]')];
    const button = document.querySelector('[data-ex-complete]');
    if (button) {
      const complete = boxes.every(box => box.checked);
      button.disabled = !complete;
      button.textContent = complete ? (draft.exerciseOrigin === 'toolbox' ? '完成练习' : '完成了，记录变化') : '完成全部步骤后继续';
    }
  }
});

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    pauseExerciseTimer();
  } else if (exerciseDeadline && view === 'exercise') {
    const remaining = Math.max(0, Math.ceil((exerciseDeadline - Date.now()) / 1000));
    if (remaining <= 0) {
      finishExercise();
    } else if (!exerciseInterval) {
      tickBreathing();
      exerciseInterval = setInterval(tickBreathing, 250);
    }
  }
});

if (persisted.mode === 'readonly') setTimeout(() => notify('浏览器存储不可用，记录将只在本次页面保留'), 500);
if (persisted.mode === 'corrupt') setTimeout(() => notify('检测到损坏的旧数据，可在“我的”中恢复或清除'), 500);
render();
registerPwa();

</script>
